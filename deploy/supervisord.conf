[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:model_svc]
command=python -m uvicorn model_service.service:app --host 127.0.0.1 --port 8001
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agents_svc]
command=python -m uvicorn agents.service:app --host 127.0.0.1 --port 8002
directory=/app
; Agents call the data API as the signed-in user; in the container it listens on 8080.
environment=PULSESCORE_DATA_URL="http://127.0.0.1:8080"
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:data_api]
command=python -m uvicorn data.api:app --host 0.0.0.0 --port 8080
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One-shot: wait for the scoring service, then (re)score everyone so a fresh or
; redeployed instance never serves an empty or stale Watchlist.
[program:score_refresh]
command=python -m data.refresh --wait 90
directory=/app
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
