app = "talent88"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Persistent storage for the database. Create once with:
#   fly volumes create talent88_data --size 1 --region iad
[mounts]
  source = "talent88_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Secrets are NOT set here. Set them with `fly secrets set` (see README: Deploy):
#   PULSESCORE_SECRET, PULSESCORE_DATA_KEY, and optionally PULSESCORE_DEMO_PASSWORD.
[env]
  PULSESCORE_ENV = "production"
  PULSESCORE_DB = "/data/pulsescore.db"
  TALENT88_LLM_ALLOW_EXTERNAL = "false"
